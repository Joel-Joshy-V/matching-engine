spring:
  application:
    name: matching-engine

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5433/tradingdb?options=-c%20timezone=UTC
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Automatically creates database tables based on your Java code
    show-sql: true     # Prints SQL queries in your console (good for learning)
    properties:
      hibernate:
        format_sql:

  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379

  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trading-engine-group
      auto-offset-reset: earliest